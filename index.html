function extractGu(addr){
  var parts=addr.split(/\s+/);
  for(var i=0;i<parts.length;i++){
    if(parts[i].match(/(구|시)$/)&&parts[i].length>=2&&!parts[i].match(/특별시|광역시/))return parts[i];
  }
  return '';
}

function setAptType(t){
  window._aptTypeFilter=t;
  var list=window._aptListAll||[];
  var typeCounts={전체:list.length};
  list.forEach(function(a){var tp=a.type||'아파트';typeCounts[tp]=(typeCounts[tp]||0)+1;});
  var isNonApt=(t==='교회'||t==='기타');
  var isAll=(t==='전체');

  // ── 헤더 제목 업데이트
  var h2=document.querySelector('#mainContent h2');
  if(h2)h2.textContent=(isAll?'🏢 부설주차장':'🏢 부설주차장 - '+t);

  // ── 타입 필터 버튼 그룹: 특정 타입 선택 시 숨김 (사이드바로 대체)
  var typeBtnGroup=document.getElementById('aptTypeBtnGroup');
  if(typeBtnGroup)typeBtnGroup.style.display=isAll?'':'none';

  // ── KPI 카드 동적 업데이트
  var filtered=list.filter(function(a){return isAll||(a.type||'아파트')===t;});
  var fSeoul=filtered.filter(function(a){return a.region==='서울';}).length;
  var fGG=filtered.filter(function(a){return a.region==='경기';}).length;
  var kpiTotalEl=document.getElementById('kpiTotal');
  var kpiTotalLbl=document.getElementById('kpiTotalLbl');
  var kpiSeoulEl=document.getElementById('kpiSeoulCnt');
  var kpiGGEl=document.getElementById('kpiGGCnt');
  if(kpiTotalEl)kpiTotalEl.textContent=filtered.length+'곳';
  if(kpiTotalLbl)kpiTotalLbl.textContent=isAll?'총 시설':t;
  if(kpiSeoulEl)kpiSeoulEl.textContent=fSeoul+'곳';
  if(kpiGGEl)kpiGGEl.textContent=fGG+'곳';

  // ── 랭킹·분석 버튼: 모든 타입에서 표시, 타입 전환 시 랭킹 초기화
  var batchArea=document.getElementById('batchResult');
  var batchStatus=document.getElementById('batchStatus');
  var batchBtns=document.querySelectorAll('#batchSeoul,#batchGG,#tabSeoul,#tabGG');
  batchBtns.forEach(function(b){if(b)b.style.display='';});
  if(batchArea)batchArea.innerHTML='';
  if(batchStatus){batchStatus.style.display='none';batchStatus.innerHTML='';}

  filterApt();
  loadSavedRanking('서울');
}

function filterApt(){
  var _srch=document.getElementById('aptSearch');
  if(!_srch)return;
  var q=(_srch.value||'').toLowerCase();
  var _reg=document.getElementById('aptRegion');
  var _gu=document.getElementById('aptGu');
  var region=_reg?_reg.value:'';
  var gu=_gu?_gu.value:'';
  var typeF=window._aptTypeFilter||'전체';
  var list=window._aptListAll||[];

  var filtered=list.filter(function(a){
    if(typeF!=='전체'&&(a.type||'아파트')!==typeF)return false;
    if(region&&a.region!==region)return false;
    if(gu&&extractGu(a.addr)!==gu)return false;
    if(q&&a.name.toLowerCase().indexOf(q)===-1&&a.addr.toLowerCase().indexOf(q)===-1)return false;
    return true;
  });

  var el=document.getElementById('aptTable');
  var typeF2=window._aptTypeFilter||'전체';
  var isApt=(typeF2==='아파트'||typeF2==='전체');
  var isNonApt=(typeF2==='교회'||typeF2==='기타');
  // 혼합일 때(전체)는 두 유형 컬럼 모두 표시
  var unitLabel=isNonApt?'개 시설':(typeF2==='아파트'?'개 단지':'개 시설·단지');
  var h='<div style="font-size:12px;color:#9ca3af;margin-bottom:6px">'+filtered.length+unitLabel+'</div>';
  h+='<div class="tbl-scroll" style="max-height:500px"><table class="tbl"><thead><tr>';
  h+='<th>시설명</th><th>주소</th><th>유형</th>';
  if(!isNonApt)h+='<th>준공</th><th>사업자</th>';
  if(!isApt||typeF2==='전체')h+='<th>연락처</th><th>담당자</th><th>주차면수</th>';
  h+='<th>지역</th>';
  if(isNonApt)h+='<th>비고</th>';
  h+='</tr></thead><tbody>';

  filtered.slice(0,100).forEach(function(a,i){
    var addrEsc=a.addr.replace(/'/g,"\\'");
    var typeColor=a.type==='교회'?'background:#fef3c7;color:#d97706':a.type==='기타'?'background:#f3f4f6;color:#6b7280':'background:#f0fdf4;color:#10b981';
    var dispRegion=a.region||extractGu(a.addr)||'-';
    var nameEsc=a.name.replace(/'/g,"\\'");
    h+='<tr style="background:'+(i%2===0?'#fff':'#f9fafb')+'">';
    h+='<td style="font-weight:600"><div style="display:flex;align-items:center;justify-content:space-between;gap:4px">';
    h+=a.name;
    h+='<button onclick="analyzeForRoi(\''+addrEsc+'\',\''+nameEsc+'\')" style="flex-shrink:0;padding:2px 7px;border-radius:6px;border:1px solid #10b981;background:#f0fdf4;color:#10b981;font-size:10px;font-weight:700;cursor:pointer">📊 ROI</button>';
    h+='</div></td>';
    h+='<td style="color:#6b7280;font-size:12px">'+a.addr+'</td>';
    h+='<td><span style="padding:2px 6px;border-radius:8px;font-size:11px;font-weight:600;'+typeColor+'">'+(a.type||'아파트')+'</span></td>';
    if(!isNonApt){h+='<td class="nowrap" style="color:#9ca3af;font-size:12px">'+(a.built||'-')+'</td>';h+='<td style="font-size:12px">'+(a.owner||'-')+'</td>';}
    if(!isApt||typeF2==='전체'){h+='<td style="font-size:12px">'+(a.contact||'-')+'</td>';h+='<td style="font-size:12px">'+(a.manager||'-')+'</td>';h+='<td style="text-align:right;font-size:12px;font-weight:600">'+(a.spaces||'-')+'</td>';}
    h+='<td><span style="padding:2px 6px;border-radius:8px;font-size:10px;font-weight:600;'+(dispRegion==='서울'?'background:#EBF2FF;color:#3182F6':'background:#f0fdf4;color:#10b981')+'">'+dispRegion+'</span></td>';
    if(isNonApt)h+='<td style="font-size:11px;color:#9ca3af">'+(a.note||'')+'</td>';
    h+='</tr>';
  });
  var colSpan=isNonApt?7:isApt?6:9;
  if(filtered.length>100)h+='<tr><td colspan="'+colSpan+'" style="text-align:center;color:#9ca3af;padding:10px">... 외 '+(filtered.length-100)+'개</td></tr>';
  h+='</tbody></table></div>';
  el.innerHTML=h;
  // 최초 렌더 시 전체 탭 활성화
  var activeBtn=document.getElementById('aptTypeBtn_'+(window._aptTypeFilter||'전체'));
  if(activeBtn&&activeBtn.style.background!=='rgb(16, 185, 129)'){
    setAptType(window._aptTypeFilter||'전체');
  }
}

function runBatch(region){
  var label=region||'전체';
  var type=window._aptTypeFilter||'전체';
  var btnId=region==='서울'?'batchSeoul':region==='경기'?'batchGG':'batchAll';
  var btn=document.getElementById(btnId);
  btn.disabled=true;btn.textContent='분석 중...';
  var st=document.getElementById('batchStatus');
  st.style.display='block';st.innerHTML='⏳ '+label+' 미분석 시설 처리 중... (탭을 닫지 마세요)';

  gasCall('webBatchAnalyze',{region:region,typeFilter:type},function(resp){
      renderRanking(resp.results);
      if(!resp.done){
        st.innerHTML='⏳ '+label+' 분석 중... '+resp.processed+'/'+resp.total+'개 완료 (남은 '+resp.remaining+'개) — 자동 계속';
        setTimeout(function(){runBatch(region);},2000);
      } else {
        btn.disabled=false;btn.textContent=(region||'전체')+' 분석';
        st.innerHTML='✅ '+label+' 분석 완료! '+resp.results.length+'개 시설 · 시트에 저장됨';
      }
    },function(err){
      btn.disabled=false;btn.textContent=(region||'전체')+' 분석';
      st.innerHTML='❌ 중단: '+err.message+' — 저장된 데이터 유지됨, 다시 버튼 누르면 이어서 진행';
    });
}

// 저장된 랭킹 로드
function loadSavedRanking(region){
  var type=window._aptTypeFilter||'전체';
  var typeLabel=type==='전체'?'':' ('+type+')';
  var ts=document.getElementById('tabSeoul');
  var tg=document.getElementById('tabGG');
  if(ts&&tg){
    if(region==='서울'){ts.style.background='#3182F6';ts.style.color='#fff';tg.style.background='#fff';tg.style.color='#10b981';}
    else{tg.style.background='#10b981';tg.style.color='#fff';ts.style.background='#fff';ts.style.color='#3182F6';}
  }
  var st=document.getElementById('batchStatus');
  if(!st)return;
  st.style.display='block';st.innerHTML=region+typeLabel+' 데이터 로드 중...';
  gasCall('webLoadRanking',{region:region,typeFilter:type},function(result){
      if(!result||!result.data||!result.data.length){
        st.innerHTML=region+typeLabel+' 저장 데이터 없음. 분석 버튼을 눌러주세요.';
        document.getElementById('batchResult').innerHTML='';
        return;
      }
      var valid=result.data.slice().sort(function(a,b){if(a.total_rev>0&&b.total_rev<=0)return -1;if(a.total_rev<=0&&b.total_rev>0)return 1;return(b.est_monthly||b.avg_rev||0)-(a.est_monthly||a.avg_rev||0);});
      st.innerHTML=region+typeLabel+' · '+result.updated+' · '+valid.length+'개 시설';
      renderRanking(valid);
    },function(err){
      st.innerHTML='❌ '+region+typeLabel+' 로드 실패: '+(err?err.message:'알수없음');
    });
}

function renderRanking(results){
  var el=document.getElementById('batchResult');
  var valid=results.filter(function(r){return !r.error;}).sort(function(a,b){if(a.total_rev>0&&b.total_rev<=0)return -1;if(a.total_rev<=0&&b.total_rev>0)return 1;return(b.est_monthly||b.avg_rev||0)-(a.est_monthly||a.avg_rev||0);});

  var h='';

  // 랭킹 테이블
  h+='<div class="tbl-card"><h3 class="card-title">🏆 사업성 랭킹 (주차장당 평균매출 순)</h3>';
  // 랭킹 필터
  var rankGuSet={};
  valid.forEach(function(r){var g=extractGu(r.addr);if(g)rankGuSet[g]=1;});
  h+='<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center">';
  h+='<input type="text" id="rankSearch" placeholder="단지명/주소 검색..." oninput="filterRank()" style="padding:7px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:12px;width:200px">';
  h+='<select id="rankGuFilter" onchange="filterRank()" style="padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:12px;max-height:200px"><option value="">전체 구/시</option>';
  Object.keys(rankGuSet).sort().forEach(function(g){
    h+='<option value="'+g+'">'+g+'</option>';
  });
  h+='</select>';
  h+='<span style="font-size:10px;color:#9ca3af">'+valid.length+'개 단지</span>';
  h+='</div>';
  h+='<div class="tbl-scroll" style="max-height:500px"><table class="tbl" id="rankTable"><thead><tr>';
  h+='<th>#</th><th>단지명</th><th>구/시</th><th>인근</th><th>50면 예상매출</th><th>월정기</th><th>기타</th>';
  h+='</tr></thead><tbody>';

  var zeroIdx=-1;for(var zi=0;zi<valid.length;zi++){if(valid[zi].total_rev<=0){zeroIdx=zi;break;}}
  valid.forEach(function(r,i){
    if(i===zeroIdx)h+='<tr><td colspan="7" style="padding:10px;background:#f1f5f9;font-size:12px;font-weight:700;color:#9ca3af;border-top:2px solid #e2e8f0">📭 인근 데이터 없음 ('+( valid.length-zeroIdx)+'곳)</td></tr>';
    var rc=i<3&&i<zeroIdx?['#f5a623','#8e8e93','#c67a3c'][i]:'#ddd';
    var gu=extractGu(r.addr)||'-';
    var addrEsc=r.addr.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var nameEsc=r.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    h+='<tr class="rank-row" style="cursor:pointer" onclick="toggleRankDetail('+i+')">';
    h+='<td><span style="display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:11px;font-weight:700;color:#fff;background:'+rc+'">'+(i+1)+'</span></td>';
    h+='<td style="font-weight:600"><div style="display:flex;align-items:center;justify-content:space-between;gap:4px">';
    h+='<span>'+r.name+'<br><span style="font-size:10px;color:#9ca3af;font-weight:400">'+r.addr+'</span></span>';
    h+='<button onclick="event.stopPropagation();analyzeForRoi(\''+addrEsc+'\',\''+nameEsc+'\')" style="flex-shrink:0;padding:2px 7px;border-radius:6px;border:1px solid #10b981;background:#f0fdf4;color:#10b981;font-size:10px;font-weight:700;cursor:pointer">📊 ROI</button>';
    h+='</div></td>';
    h+='<td class="nowrap"><span style="padding:2px 6px;border-radius:6px;font-size:10px;background:#f3f4f6;color:#374151">'+gu+'</span></td>';
    h+='<td class="nowrap">'+r.lot_cnt+'곳</td>';
    h+='<td class="nowrap" style="font-weight:700;color:#dc2626">'+FW(r.est_monthly||r.avg_rev)+'</td>';
    h+='<td class="nowrap" style="color:#3182F6">'+FW(r.est_m||r.m_rev)+'</td>';
    h+='<td class="nowrap" style="color:#f59e0b">'+FW(r.est_o||r.o_rev)+'</td>';
    h+='</tr>';
    h+='<tr id="rankDetail'+i+'" style="display:none"><td colspan="7" style="padding:0"></td></tr>';
  });
  h+='</tbody></table></div>';

  var noData=results.filter(function(r){return r.error||r.avg_rev===0;});
  var totalApt=results.length>0&&results[0].addr&&results[0].addr.indexOf('서울')>=0?474:291;
  var notAnalyzed=totalApt-results.length;
  h+='<div style="font-size:12px;color:#9ca3af;margin-top:10px;padding:10px;background:#f8fafc;border-radius:8px;line-height:1.8">';
  h+='📊 전체 '+totalApt+'개 단지 중 <b>'+results.length+'개</b> 분석 완료';
  if(noData.length>0)h+=' · ⚠️ 인근 매출 없음 '+noData.length+'곳';
  if(notAnalyzed>0)h+='<br>📭 미분석 '+notAnalyzed+'곳 (인근 500m 제휴주차장 없음 — 반경 확대 시 분석 가능)';
  h+='</div>';
  h+='</div>';

  el.innerHTML=h;
  window._rankResults=valid;
}

function filterRank(){
  var q=(document.getElementById('rankSearch').value||'').toLowerCase();
  var guF=document.getElementById('rankGuFilter')?document.getElementById('rankGuFilter').value:'';
  var rows=document.querySelectorAll('.rank-row');
  var details=document.querySelectorAll('[id^="rankDetail"]');
  rows.forEach(function(row,i){
    var text=row.textContent.toLowerCase();
    var matchQ=!q||text.indexOf(q)>=0;
    var matchGu=!guF||text.indexOf(guF.toLowerCase())>=0;
    var show=matchQ&&matchGu;
    row.style.display=show?'':'none';
    if(details[i])details[i].style.display='none';
  });
}

var _openRankIdx=-1;
function toggleRankDetail(idx){
  // 이전 상세 닫기
  if(_openRankIdx>=0){
    var prev=document.getElementById('rankDetail'+_openRankIdx);
    if(prev){prev.style.display='none';prev.querySelector('td').innerHTML='';}
  }
  if(_openRankIdx===idx){_openRankIdx=-1;return;}
  _openRankIdx=idx;

  var r=window._rankResults[idx];
  var det=document.getElementById('rankDetail'+idx);
  if(!det)return;
  det.style.display='';
  var td=det.querySelector('td');

  // 저장된 데이터로 바로 표시
  var h='<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin:6px 0">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  h+='<b style="font-size:13px;color:#3182F6">📌 '+r.name+'</b>';
  h+='<button onclick="analyzeApt(\''+r.addr.replace(/'/g,"\\'")+'\')" style="padding:5px 12px;border-radius:6px;border:1px solid #3182F6;background:#EBF2FF;color:#3182F6;font-size:11px;font-weight:600;cursor:pointer">🔍 상세 입지분석</button>';
  h+='</div>';
  h+='<div style="font-size:11px;color:#6b7280;margin-bottom:10px">📍 '+r.addr+' · 인근 '+r.lot_cnt+'곳'+(r.total_spaces?' · 총 '+r.total_spaces+'면':'')+'</div>';

  // 매출 카드
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px">';
  h+='<div style="background:#EBF2FF;border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:#3182F6">월정기</div><div style="font-size:14px;font-weight:800;color:#3182F6">'+FW(r.m_rev)+'</div><div style="font-size:9px;color:#9ca3af">'+F(r.m_cnt||0)+'건</div></div>';
  h+='<div style="background:#fffbeb;border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:#f59e0b">기타</div><div style="font-size:14px;font-weight:800;color:#f59e0b">'+FW(r.o_rev)+'</div><div style="font-size:9px;color:#9ca3af">'+F(r.o_cnt||0)+'건</div></div>';
  h+='<div style="background:#fef2f2;border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:#dc2626">50면 예상매출</div><div style="font-size:14px;font-weight:800;color:#dc2626">'+FW(r.est_monthly||r.avg_rev)+'</div><div style="font-size:9px;color:#9ca3af">주차장당평균 '+FW(r.avg_rev)+'</div></div>';
  h+='<div style="background:#f0fdf4;border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:#10b981">월정기 평균가</div><div style="font-size:14px;font-weight:800;color:#10b981">'+FW(r.avg_price||0)+'</div><div style="font-size:9px;color:#9ca3af">이용자 '+F(r.users||0)+'명</div></div>';
  h+='</div>';
  h+='<div style="font-size:10px;color:#9ca3af">* 클릭하면 펼쳐지는 요약 데이터 · 상세 권종별 분석은 "상세 입지분석" 버튼</div>';
  h+='</div>';
  td.innerHTML=h;
  det.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function analyzeApt(addr){
  // 메인 화면 초기화 후 주소 분석 실행
  var mc=document.getElementById('mainContent');
  mc.innerHTML='<div class="loading"><div><div class="spinner"></div><p style="margin-top:10px;color:#3182F6;font-weight:700">'+addr+' 분석 중...</p></div></div>';
  document.getElementById('addr').value=addr;

  // 지오코딩 → 분석 실행
  gasCall('geocodeForWeb',{address:addr},function(result){
      if(result.error){mc.innerHTML='<div class="card" style="color:red">'+result.error+'</div>';return;}
      state.lat=result.lat;state.lng=result.lng;state.locName=result.name||addr;state.data=null;
      updateCoordUI();updatePresetUI();
      document.getElementById('runBtn').disabled=false;
      doRun();
    },function(err){
      mc.innerHTML='<div class="card" style="color:red">주소 검색 실패: '+err.message+'</div>';
    });
}

function goBackToMain(){
  resetAptTypeTabs();

  var mc=document.getElementById('mainContent');
  if(state.data){
    renderMain();
  } else {
    mc.innerHTML='<div class="placeholder"><div><div class="icon">📍</div><h2>주소를 검색하고 분석하세요</h2><p>주소/장소 입력 → 반경 선택 → 🔍 실행</p></div></div>';
  }
}
